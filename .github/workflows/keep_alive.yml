# .github/workflows/keep_alive.yml
name: Keep API and Streamlit alive

on:
  schedule:
    - cron: '*/12 6-18 * * 1-5' # 8h-20h Paris (UTC+2) → 6h-18h UTC, lun-ven
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -sS -w '\nStatus: %{http_code}\n' https://bank-marketing-prediction-api.onrender.com/health

      - name: Ping Streamlit
        run: |
          curl -sS -w '\nStatus: %{http_code}\n' https://bank-marketing-streamlit-app.onrender.com